# Fast iteration: `docker compose -f docker-compose.dev.yml up`, then open
# http://localhost:5173/v2/. Source is bind-mounted; the API reloads on Python
# edits and Vite hot-reloads the UI. Data lives in the `dev-data` volume.
services:
  api:
    image: python:3.12-slim
    working_dir: /app/src
    command: sh -c "pip install -q -r /app/requirements-server.txt -c /app/requirements-linux-py312.lock && uvicorn app:app --host 0.0.0.0 --port 22400 --workers 1 --reload"
    environment:
      SHEPHERD_HOME: /data
      PYTHONPATH: /app/src
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./src:/app/src
      - ./VERSION:/app/VERSION:ro
      - ./requirements-server.txt:/app/requirements-server.txt:ro
      - ./requirements-linux-py312.lock:/app/requirements-linux-py312.lock:ro
      - dev-data:/data
      - pip-cache:/root/.cache/pip
    ports: ["127.0.0.1:22410:22400"]
  web:
    image: node:24-slim
    working_dir: /web
    command: sh -c "corepack enable && corepack prepare pnpm@12.11.2 --activate && pnpm install --frozen-lockfile && pnpm dev --port 5173"
    environment:
      API_TARGET: http://api:22400
    volumes:
      - ./web:/web
      - web-modules:/web/node_modules
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [api]
volumes:
  dev-data:
  pip-cache:
  web-modules:
